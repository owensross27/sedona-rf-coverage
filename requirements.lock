#
# WHY THIS EXISTS. requirements.txt specifies floors (`>=`), so every
# `make setup` -- on a laptop, in CI, and inside the Docker build -- resolved
# whatever was newest that day. That is not a theoretical hazard: pyarrow moved
# 25.0.0 -> 25.0.1 within a day of the venv that produced the numbers in this
# README, measured 2026-08-11. The repo's central claim is that a stranger can
# clone it and reproduce the demo, and a floating resolve quietly puts an
# expiry date on that.
#
# The image is the sharper edge. It builds on Ubuntu jammy + deadsnakes
# python3.11 with pip 22.0.2, and numpy, rasterio and scipy have all already
# dropped cp311 wheels in their newest releases -- so a future resolve does not
# fail cleanly, it backtracks through old versions looking for one that builds
# from source, and either takes an hour or dies in a compiler.
#
# Regenerate deliberately, never casually, and re-run `make test` before
# committing the result:
#
#     make setup && uv pip freeze -p .venv | grep -v '^-e' > requirements.lock
