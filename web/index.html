<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WV RF coverage</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<!-- Turns an H3 index back into a hexagon in the browser. The footprint blob
     therefore ships cell IDS, not geometry: 12 bytes a cell instead of a
     ~200-byte polygon, which is what keeps 1.2M of them to 14.6 MB. -->
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 2; background: rgba(255,255,255,.95);
    border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 13px;
  }
  /* The two left-hand panels are capped so they cannot collide. They used to
     be free-height and the click panel grew under the controls, overlapping
     it: two stacks of text on top of each other, which reads as a broken
     page rather than a dense one. The click panel gets a fixed budget and the
     controls get every remaining pixel, rather than both taking a share of the
     height: a flat 52vh cap starved the controls on a short window and pushed
     the service-band filters below the fold. */
  #controls { top: 10px; left: 10px; padding: 10px 12px; max-width: 240px;
              max-height: calc(100vh - 268px); overflow-y: auto; }
  #controls h1 { font-size: 14px; margin: 0 0 6px; }
  #controls label { display: block; margin: 2px 0; cursor: pointer; }
  #controls .note { color: #777; font-size: 10.5px; line-height: 1.3; margin-top: 5px; }
  #search { position: relative; margin: 6px 0 2px; }
  #q { width: 100%; box-sizing: border-box; font: inherit; font-size: 12px;
       border: 1px solid #ccc; border-radius: 4px; padding: 4px 6px; }
  #hits { list-style: none; margin: 2px 0 0; padding: 0; max-height: 168px;
          overflow-y: auto; border: 1px solid #ddd; border-radius: 4px;
          background: #fff; }
  #hits:empty { display: none; border: none; }
  #hits li { padding: 3px 6px; cursor: pointer; font-size: 12px; }
  #hits li:hover, #hits li[aria-selected="true"] { background: #eef4ff; }
  #filters { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 6px; }
  #filters .fhead { font-weight: 600; font-size: 11px; margin-bottom: 3px; }
  #filters .fhead a { font-weight: 400; color: #06c; text-decoration: none; }
  #filters label { font-size: 12px; }
  #filters .n { color: #666; }
  #info { bottom: 24px; left: 10px; padding: 10px 12px; max-width: 300px;
          display: none; max-height: 220px; overflow-y: auto; }
  /* The link budget is the answer to "how was this computed", which is a
     question you ask once. Left expanded it was eight lines of dense prose
     under every click, which buries the six numbers above it. */
  #info details { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ddd; }
  #info summary { cursor: pointer; color: #06c; font-size: 12px; }
  #info details p { margin: 6px 0 0; color: #444; }
  #info h2 { font-size: 13px; margin: 0 0 4px; }
  #info .sub { color: #666; font-size: 11px; margin-bottom: 4px; }
  #info td { padding: 1px 6px 1px 0; vertical-align: top; }
  #info .why { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ddd; color: #444; }
  #legend { bottom: 24px; right: 10px; padding: 8px 12px; font-size: 11px; }
  #tileerr { top: 10px; left: 50%; transform: translateX(-50%); max-width: 420px;
             padding: 10px 14px; display: none; font-size: 12px; line-height: 1.4;
             border-left: 4px solid #d1495b; }
  #tileerr code { display: block; margin-top: 5px; color: #666; font-size: 11px; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 2px; }
  #ask { top: 10px; right: 50px; width: 320px; padding: 10px 12px; }
  #ask h2 { font-size: 13px; margin: 0 0 6px; }
  #ask input, #ask textarea {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 12px;
    border: 1px solid #ccc; border-radius: 4px; padding: 5px; margin: 3px 0;
  }
  #ask textarea { resize: vertical; min-height: 46px; }
  #ask button { font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
  #ask .keyline { color: #666; font-size: 11px; margin: 2px 0 6px; }
  #answer { margin-top: 8px; font-size: 12px; line-height: 1.45; max-height: 40vh; overflow-y: auto; white-space: pre-wrap; }
  #ask-toggle {
    position: absolute; top: 10px; right: 10px; z-index: 3; width: 30px; height: 30px;
    border-radius: 6px; border: none; background: rgba(255,255,255,.95); cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 15px; line-height: 30px; padding: 0;
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" class="panel">
  <h1>West Virginia RF coverage</h1>
  <div id="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Find a town..." aria-label="Find a town"
           aria-controls="hits" hidden>
    <ul id="hits" role="listbox" aria-label="Place matches"></ul>
  </div>
  <div id="modes"></div>
  <label><input type="checkbox" id="towers-toggle" checked> ASR structures</label>
  <label><input type="checkbox" id="sites-toggle" checked> Recommended sites</label>
  <div id="filters">
    <div class="fhead">Service band <a href="#" id="fall">all</a> ·
      <a href="#" id="fnone">none</a></div>
  </div>
  <div class="note" id="fcount"></div>
  <div class="note" id="note">Modelled 700&nbsp;MHz LTE, -105&nbsp;dBm threshold.</div>
  <div class="note" id="zoomhint"></div>
</div>

<div id="info" class="panel"></div>
<div id="tileerr" class="panel"></div>
<div id="legend" class="panel"></div>

<button id="ask-toggle" title="Ask about this map">?</button>
<div id="ask" class="panel" hidden>
  <h2>Ask about this map</h2>
  <input id="apikey" type="password" autocomplete="off" spellcheck="false"
         placeholder="Anthropic API key (sk-ant-...)">
  <div class="keyline">Your key is kept in this browser's localStorage and sent
  only to api.anthropic.com. This page is static: there is no server here to
  send it to. <a href="https://console.anthropic.com/settings/keys"
  target="_blank" rel="noopener">Get a key</a>.</div>
  <textarea id="question" placeholder="e.g. why is coverage so bad in the cell I clicked?"></textarea>
  <button id="asksend">Ask</button>
  <div id="answer"></div>
</div>

<script>
const RSRP_LEGEND = [["#2c105c","-125 dBm"],["#b63679","-105 (threshold)"],
                     ["#fdae78","-85"],["#fcfdbf","-70"]];

// EVERY mode paints EVERY hex layer, roll-ups included. That is only possible
// because make_web_data.py emits the same property NAMES at r5/r6/r7 as at r8
// -- including ones that are degenerate at r8, like cell_pct being 0 or 100.
// The earlier version had a single hardcoded ramp for the roll-ups, so tree
// cover, relief and population all silently painted the same coverage
// choropleth at any zoom below the detail level, which reads as a mode
// switcher that does nothing.
//
// What each property means at a roll-up level is in make_web_data.py: counts
// sum, ground properties take an area mean, and RSRP takes a MEDIAN (never a
// mean -- dBm is logarithmic, and averaging a strong cell against a dead one
// invents a comfortable middle for a place with a hole in it).
const MODES = {
  rsrp: {
    label: "Signal (best-server RSRP)",
    // No coalesce to -125: a cell with no link at all has no rsrp, and
    // painting it as the bottom of the ramp is indistinguishable from a very
    // weak but real signal. Undefined leaves the fill transparent, which is
    // honest, and "Coverage vs gap" is the mode that counts those cells.
    paint: ["interpolate", ["linear"], ["get", "rsrp"],
            -125, "#2c105c", -115, "#711f81", -105, "#b63679",
            -95, "#ee605e", -85, "#fdae78", -70, "#fcfdbf"],
    legend: RSRP_LEGEND,
    note: z => z ? "Per-cell RSRP." : "Median RSRP of the cells here that have a link.",
  },
  // The two raster entries are appended at runtime by loadSurfaces() -- they
  // exist only when the per-pixel surfaces have been built (make surface).
  covered: {
    label: "Coverage vs gap",
    // cell_pct is 0 or 100 at r8, so this stays the crisp two-colour map it
    // always was there, and becomes a gradient on the roll-ups for free.
    paint: ["interpolate", ["linear"], ["get", "cell_pct"],
            0, "#d1495b", 50, "#edae49", 85, "#c3d17a", 100, "#7cbf8c"],
    legend: [["#d1495b","0% of ground served"],["#edae49","50%"],
             ["#c3d17a","85%"],["#7cbf8c","100%"]],
    note: z => z ? "Covered or gap." : "Share of CELLS served.",
  },
  pop_pct: {
    label: "Population covered",
    paint: ["interpolate", ["linear"], ["get", "pop_pct"],
            0, "#d1495b", 50, "#edae49", 85, "#c3d17a", 100, "#7cbf8c"],
    legend: [["#d1495b","0% of people covered"],["#edae49","50%"],
             ["#c3d17a","85%"],["#7cbf8c","100%"]],
    note: () => "Share of PEOPLE served. Blank where nobody lives -- "
                + "0/0 is not 0% coverage.",
  },
  pop: {
    label: "Population density",
    // DENSITY, not a count. `pop` sums on the way up, so a raw-count ramp
    // saturates to solid black two zooms out; people per km2 means the same
    // thing at every level.
    paint: ["interpolate", ["linear"], ["sqrt", ["coalesce", ["get", "pop_km2"], 0]],
            0, "#f7fbff", 5, "#c6dbef", 10, "#6baed6", 22, "#2171b5", 45, "#08306b"],
    legend: [["#f7fbff","0/km²"],["#c6dbef","25"],["#6baed6","100"],
             ["#2171b5","500"],["#08306b","2000+"]],
  },
  tree: {
    label: "Tree cover",
    paint: ["interpolate", ["linear"], ["get", "tree"],
            0, "#f7fcf5", 50, "#a1d99b", 80, "#41ab5d", 100, "#00441b"],
    legend: [["#f7fcf5","0%"],["#41ab5d","80%"],["#00441b","100%"]],
  },
  relief: {
    label: "Terrain relief",
    paint: ["interpolate", ["linear"], ["get", "relief"],
            0, "#ffffe5", 100, "#fe9929", 200, "#cc4c02", 300, "#662506"],
    legend: [["#ffffe5","0 m"],["#fe9929","100 m"],["#662506","300 m"]],
  },
};

// LEVEL OF DETAIL. Four H3 resolutions on DISJOINT zoom bands, so exactly one
// hex layer is ever drawn and the feature count in view stays roughly constant
// while panning. Statewide that is ~320 / ~1,950 / ~12,900 / 88,281 cells --
// without this, z6 would try to draw all 88,281 at once.
//
// maxzoom is EXCLUSIVE in MapLibre (a layer is hidden at and above it), so the
// bands butt up against each other with no overlap and no gap. These must stay
// in step with the -Z/-z pairs in scripts/make_tiles.sh: a layer whose band
// falls outside the zoom range its tiles were built for renders nothing at
// all, silently.
// BANDS TIGHTENED. r5 hexagons are 253 km2 -- about 20 km across -- and they
// used to hold every zoom from 4 to 8, which is every zoom at which West
// Virginia fits on a screen. The statewide view, the one people actually look
// at, was therefore drawn in cells that smear whole counties into one colour.
// r6 (36 km2) now owns that range at 6x the granularity and still only ~1,950
// cells, and each level hands over two zooms earlier than before.
//
// These MUST stay in step with the -Z/-z pairs in scripts/make_tiles.sh: a
// band outside the zoom range its tiles were built for renders nothing at all,
// silently. maxzoom is EXCLUSIVE in MapLibre, so the bands butt together with
// no overlap and no gap.
const LOD = [
  // `n` is how many r8 cells one hexagon merges: H3 has 7 children per level,
  // so 7, 49, 343. Shown to the viewer, because a 253 km2 hexagon summarising
  // 343 measurements should not look like one measurement.
  { id: "hex5", min: 0, max: 6,  res: "r5", km2: 253, n: 343 },
  { id: "hex6", min: 6, max: 9,  res: "r6", km2: 36,  n: 49 },
  { id: "hex7", min: 9, max: 11, res: "r7", km2: 5.2, n: 7 },
];
const DETAIL_ZOOM = 11;   // r8 (0.74 km2) and the full click panel from here up
const HEX_LAYERS = [...LOD.map(l => l.id), "hexes"];

// The four small descriptors (meta, surface_meta, places, footprints index)
// are always revalidated. They DESCRIBE the big binaries -- scope, bounds,
// thresholds, byte offsets -- and a cached descriptor paired with a rebuilt
// binary is not a stale page, it is a confidently wrong one: offsets that
// address the wrong transmitter, a caption from a different scope. Measured
// here, not theorised: a rebuilt web/data left this page reading the previous
// surface_meta.json, which silently disabled the scope check below.
// Revalidation costs a 304 on four files of at most 94 KB; the 22.7 MB
// tileset and the 14.6 MB blob still cache normally.
const FRESH = { cache: "no-cache" };

protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/positron",
  center: [-81.55, 38.32],
  zoom: 9,
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }),
               "bottom-left");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "imperial" }),
               "bottom-left");

function buildOverlay() {
  // Absolute URL from the page's own origin: a RELATIVE pmtiles:// URL also
  // fails silently. Origin-relative keeps the file deployable to any host.
  map.addSource("rf", {
    type: "vector",
    url: "pmtiles://" + new URL("data/rf.pmtiles", location.href).href,
  });

  // Coarse first so the r8 layer sits on top; they never coexist at a given
  // zoom anyway, but draw order decides which one owns the cursor if a band
  // boundary is ever made to overlap.
  for (const l of LOD) {
    map.addLayer({
      id: l.id, type: "fill", source: "rf", "source-layer": l.id,
      minzoom: l.min, maxzoom: l.max,
      paint: { "fill-color": MODES.rsrp.paint, "fill-opacity": 0.62,
               "fill-outline-color": "rgba(0,0,0,0.12)" },
    });
  }

  map.addLayer({
    id: "hexes", type: "fill", source: "rf", "source-layer": "hexes",
    minzoom: DETAIL_ZOOM,
    paint: { "fill-color": MODES.rsrp.paint, "fill-opacity": 0.62,
             "fill-outline-color": "rgba(0,0,0,0.12)" },
  });
  map.addLayer({
    id: "hex-hover", type: "line", source: "rf", "source-layer": "hexes",
    minzoom: DETAIL_ZOOM,
    paint: { "line-color": "#000", "line-width": 2 },
    filter: ["==", ["get", "h3"], ""],
  });
  // The clicked transmitter's own coverage. Empty until something is clicked,
  // and it sits ABOVE the choropleth (the two answer different questions and
  // the footprint is the foreground one) but BELOW the markers, so the next
  // transmitter stays clickable through it.
  map.addSource("fp", { type: "geojson",
                        data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "fp-fill", type: "fill", source: "fp",
    paint: { "fill-color": MODES.rsrp.paint, "fill-opacity": 0.75 },
  });
  // The coverage contour: the OUTER boundary of the served cells, dissolved
  // by h3.cellsToMultiPolygon. Outlining each cell individually instead put a
  // stroke on all 432 of them, which at the zoom a 40 km footprint fits on
  // screen is a solid mat of line that hides the signal ramp underneath --
  // the same failure the ASR markers had statewide. The shape stays ragged,
  // and holes stay holes: that is what terrain does to a footprint, and a
  // tidy circle would be a different claim entirely.
  map.addSource("fp-edge", { type: "geojson",
                             data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "fp-edge", type: "line", source: "fp-edge",
    paint: { "line-color": "#00e5ff", "line-width": 1.6, "line-opacity": 0.95 },
  });

  map.addLayer({
    id: "towers", type: "circle", source: "rf", "source-layer": "towers",
    // Statewide there are 6,696 registered structures. Drawn at z4 they are a
    // solid mat of white circles that completely hides the coverage
    // choropleth underneath -- the map stops showing the thing it is for.
    // They only mean anything once you are looking at a region, which is the
    // same zoom the r7 roll-up takes over at.
    minzoom: 9,
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["coalesce", ["get","h"], 45],
                        20, 2.5, 100, 5, 300, 9],
      "circle-color": "#ffffff", "circle-stroke-color": "#333",
      "circle-stroke-width": 1,
    },
  });
  map.addLayer({
    id: "sites", type: "circle", source: "rf", "source-layer": "sites",
    paint: { "circle-radius": 7, "circle-color": "#ffd166",
             "circle-stroke-color": "#000", "circle-stroke-width": 1.5 },
  });
  map.addLayer({
    id: "site-rank", type: "symbol", source: "rf", "source-layer": "sites",
    // text-font MUST name a font the basemap's glyph server actually has
    // (OpenFreeMap serves Noto). Omitting it falls back to "Open Sans
    // Regular", the glyph request 404s, and the unresolved dependency wedges
    // EVERY tile of this source -- all five layers blank, fills included, no
    // error surfaced. This one missing line was the whole "map renders
    // nothing" failure.
    layout: { "text-field": ["to-string", ["get", "rank"]],
              "text-font": ["Noto Sans Regular"],
              "text-size": 10, "text-offset": [0, -1.3] },
    paint: { "text-halo-color": "#fff", "text-halo-width": 1.5 },
  });

  const mode = document.querySelector('input[name="mode"]:checked');
  setMode(mode ? mode.value : "rsrp");

  // An empty map must never be a quiet map. If the tileset fails to load, every
  // control still works, the basemap still draws, and the page looks like a
  // region with no coverage data rather than a page that failed -- which is the
  // same class of lie as a dropped hexagon. Measured, not hypothesised: a
  // sandboxed browser that strips Range headers from worker requests makes
  // pmtiles fail with exactly this, and the page said nothing at all.
  map.on("error", e => {
    const msg = String((e && e.error && e.error.message) || (e && e.message) || e);
    if (!/pmtiles|byte serving|content-length|rf\.pmtiles/i.test(msg)) return;
    const el = document.getElementById("tileerr");
    if (!el || el.style.display === "block") return;
    el.style.display = "block";
    el.innerHTML = `<b>The coverage tiles did not load.</b><br>
      The basemap and the controls are fine; the RF data is missing, so this is
      an empty map rather than an uncovered state. Usually this means the host
      answered a byte-range request with the whole file. <br><code>${
        msg.replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))
      }</code>`;
  });
}

// Per-pixel propagation surfaces (90 m, terrain shadows visible) as image
// overlays under the hex layer. Optional on purpose: a clone that has not run
// `make surface` still gets a fully working map, so absence must degrade to
// "two fewer radio buttons", never a broken page.
async function loadSurfaces() {
  let meta;
  try {
    const r = await fetch("data/surface_meta.json", FRESH);
    if (!r.ok) return;
    meta = await r.json();
  } catch { return; }
  // A surface built at one scope on a tileset built at another is not a
  // smaller version of the same map -- it is a county-sized patch of colour
  // floating on a state, captioned as the state's signal surface. `make
  // surface` is a ~100M-link job at demo scope and ~30x that statewide, so
  // the two genuinely can be out of step, and the honest failure is to not
  // offer the mode at all. make_overlays.py stamps the scope it ran at.
  if (meta.scope && META.scope && meta.scope !== META.scope) {
    console.warn(`per-pixel surfaces were built at scope "${meta.scope}" but `
      + `the tiles are "${META.scope}" -- surface modes hidden. `
      + `Rebuild with: make surface SCOPE=${META.scope}`);
    return;
  }
  const surfaces = {
    surf_cur: { key: "rsrp_surface_current",
                label: "Signal surface (per-pixel, current towers)" },
    surf_new: { key: "rsrp_surface_upgraded",
                label: "Signal surface (per-pixel, +20 sites)" },
  };
  for (const [mode, s] of Object.entries(surfaces)) {
    if (!meta[s.key]) continue;
    // The source is DECLARED here and added on first selection (see setMode).
    // Statewide these two PNGs are 12 MB each, and a MapLibre image source
    // fetches its URL the moment it is added -- so eagerly adding both spent
    // 24 MB of every visitor's bandwidth, and ~130 MB of their memory once
    // decoded, to serve a mode most of them never open. Same reasoning as the
    // footprint blob being range-fetched on click rather than loaded up front.
    MODES[mode] = { raster: true, label: s.label, legend: RSRP_LEGEND,
                    src: { type: "image", url: `data/${s.key}.png`,
                           coordinates: meta[s.key] } };
    const label = document.createElement("label");
    label.innerHTML = `<input type="radio" name="mode" value="${mode}"> ${s.label}`;
    document.getElementById("modes").appendChild(label);
  }
}

// The caption used to hardcode "Demo scope: Kanawha County", which quietly
// became false the moment a statewide tileset was built. meta.json is written
// by the same script that writes the tiles, so it cannot disagree with them.
let META = {};
async function loadMeta() {
  try {
    const m = await (await fetch("data/meta.json", FRESH)).json();
    META = m;
    if (!m.scope_desc) return;
    document.getElementById("note").innerHTML +=
      `<br>${m.scope_desc}, ${Number(m.n_hexes).toLocaleString()} cells.`;
    if (m.bounds) map.fitBounds(m.bounds, { padding: 24, duration: 0 });
    // After META lands, not before: the checkbox labels carry the per-band
    // populations and there is nothing to build without them.
    buildFilters();
  } catch { /* a map with no caption still works */ }
}

// "style.load", NOT "load". `load` waits for the first visually complete
// render, which includes the third-party basemap's tiles -- so if
// tiles.openfreemap.org is slow, down, or blocked by a corporate proxy, the
// event never fires and NONE of this runs: no source, no layers, no controls,
// no error in the console. The RF data is the product here and the basemap is
// decoration, so the overlay must not be hostage to it. Measured: in a sandbox
// that blocks the tile host, `load` never fires and the page renders black
// while every asset it actually needs sits loaded and idle.
map.on("style.load", () => {
  buildOverlay();
  // loadSurfaces runs AFTER meta lands, not beside it: it compares its own
  // scope against the tileset's, and racing that comparison against an empty
  // META would let a mismatched surface through whenever the two fetches
  // resolved in the wrong order -- intermittently, which is the worst way.
  loadMeta().then(loadSurfaces);
  loadPlaces();
  loadFootprintIndex();

  const modes = document.getElementById("modes");
  Object.entries(MODES).forEach(([key, m], i) => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="radio" name="mode" value="${key}"
                       ${i === 0 ? "checked" : ""}> ${m.label}`;
    modes.appendChild(label);
  });
  modes.addEventListener("change", e => setMode(e.target.value));

  document.getElementById("towers-toggle").addEventListener("change", e =>
    map.setLayoutProperty("towers", "visibility", e.target.checked ? "visible" : "none"));
  document.getElementById("sites-toggle").addEventListener("change", e => {
    for (const id of ["sites", "site-rank"])
      map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
  });

  for (const l of LOD) {
    map.on("click", l.id, e => showRollup(e.features[0].properties, l.res));
    map.on("mouseenter", l.id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", l.id, () => map.getCanvas().style.cursor = "");
  }
  map.on("zoom", updateZoomUI);
  updateZoomUI();

  const askPanel = document.getElementById("ask");
  document.getElementById("apikey").value =
    localStorage.getItem("rfc_api_key") || "";
  document.getElementById("ask-toggle").addEventListener("click", () => {
    askPanel.hidden = !askPanel.hidden;
    if (!askPanel.hidden) document.getElementById("question").focus();
  });
  document.getElementById("asksend").addEventListener("click", ask);
  document.getElementById("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask();
  });

  map.on("click", "hexes", e => showHex(e.features[0].properties));
  map.on("mousemove", "hexes", e => {
    map.getCanvas().style.cursor = "pointer";
    map.setFilter("hex-hover", ["==", ["get", "h3"], e.features[0].properties.h3]);
  });
  map.on("mouseleave", "hexes", () => {
    map.getCanvas().style.cursor = "";
    map.setFilter("hex-hover", ["==", ["get", "h3"], ""]);
  });
  // Clicking a transmitter draws ITS OWN propagation, which is a different
  // question from the choropleth's "how good is signal here" and the reason
  // the footprint blob exists.
  map.on("click", "towers", e => {
    const p = e.features[0].properties;
    showFootprint(String(p.asr), `ASR ${p.asr}`,
                  `${p.h ?? "?"} m ${p.type ?? "structure"}, registered`);
  });
  map.on("click", "sites", e => {
    const p = e.features[0].properties;
    showFootprint(`NEW:${p.rank}`, `Recommended site #${p.rank}`,
                  `${p.kind}, ${p.h} m mast, not yet built`);
  });
  for (const id of ["towers", "sites"]) {
    map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", id, () => map.getCanvas().style.cursor = "");
  }
});

function setMode(key) {
  const m = MODES[key];
  CURRENT_MODE = key;
  // Add the raster on first selection, not at load. Below the hexes so
  // hover/click outlines stay visible; the hex fill is dropped to near-zero
  // opacity in surface modes rather than hidden, so the click-a-hex panel
  // keeps working on top of the raster.
  if (m.raster && m.src && !map.getSource(key)) {
    map.addSource(key, m.src);
    map.addLayer({ id: key, type: "raster", source: key,
                   paint: { "raster-opacity": 1.0 },
                   layout: { visibility: "none" } }, "hexes");
  }
  for (const id of ["surf_cur", "surf_new"])
    if (map.getLayer(id))
      map.setLayoutProperty(id, "visibility",
                            m.raster && id === key ? "visible" : "none");
  // One ramp, every hex layer. Surface modes drop the fills to a nearly
  // invisible click target rather than hiding them, so the explainability
  // panel keeps working on top of the raster.
  hexOpacity();
  for (const id of HEX_LAYERS)
    if (map.getLayer(id) && !m.raster)
      map.setPaintProperty(id, "fill-color", m.paint);
  updateZoomUI();
}

// The legend is now the same at every zoom, because the ramp is. What still
// changes is WHAT ONE CELL IS: 0.74 km2 at full detail, up to 253 km2 rolled
// up. That has to be on screen, or a viewer reads a 20 km hexagon as a
// measurement of a place.
let CURRENT_MODE = "rsrp";
function activeLevel() {
  const z = map.getZoom();
  if (z >= DETAIL_ZOOM) return { res: "r8", km2: 0.74, detail: true };
  return LOD.find(l => z >= l.min && z < l.max) || LOD[0];
}
function updateZoomUI() {
  const lvl = activeLevel();
  const m = MODES[CURRENT_MODE];
  document.getElementById("legend").innerHTML = (m.legend || []).map(([c, t]) =>
    `<div><span class="swatch" style="background:${c}"></span>${t}</div>`).join("");
  const scale = lvl.detail
    ? `Full detail: one hexagon = one H3 r8 cell, 0.74 km². Click for the breakdown.`
    : `Rolled up to H3 ${lvl.res}: one hexagon = ${lvl.km2} km², `
      + `${lvl.n} r8 cells merged. Zoom in for finer.`;
  const note = m.note ? " " + m.note(lvl.detail) : "";
  document.getElementById("zoomhint").textContent = scale + note;
}

// ---- Service-band filters ---------------------------------------------------
// Exhaustive and mutually exclusive, worst first. Kept in the same order as
// BANDS in scripts/make_web_data.py; the labels and counts come from
// meta.json, so they are computed by the pipeline rather than typed here and
// cannot drift from the tiles.
const BANDS = ["no_link", "gap", "single", "multi", "over"];
let ACTIVE = new Set(BANDS);

// ONE expression for both tile shapes, and they need DIFFERENT rules.
//
// At r8 a cell is in exactly one band, so the filter is exact: does `band`
// match. A rolled-up cell is not in one band -- an r6 hexagon merges 49 r8
// cells and almost always contains at least one of every band -- so "contains
// any" would match nearly every hexagon in the state and the filter would look
// broken while technically working.
//
// The roll-up rule is therefore MAJORITY: show a parent when the selected
// bands account for more than half the PEOPLE in it, falling back to half the
// cells where nobody lives (0/0 is not a majority of anything). "Mostly
// uncovered" is the question someone zoomed out is actually asking; the exact
// per-cell answer is two zooms away and the panel says so.
function bandFilter() {
  const on = BANDS.filter(b => ACTIVE.has(b));
  if (on.length === BANDS.length) return null;          // no filter at all
  if (!on.length) return ["==", ["literal", 1], ["literal", 0]];  // nothing
  const sum = pfx => ["+", ...on.map(b => ["coalesce", ["get", pfx + b], 0])];
  const share = ["case",
    [">", ["coalesce", ["get", "pop"], 0], 0], ["/", sum("p_"), ["get", "pop"]],
    [">", ["coalesce", ["get", "cells"], 0], 0], ["/", sum("c_"), ["get", "cells"]],
    0];
  return ["any",
    ["in", ["coalesce", ["get", "band"], ""], ["literal", on]],
    [">", share, 0.5],
  ];
}

function applyFilters() {
  const f = bandFilter();
  for (const id of HEX_LAYERS) if (map.getLayer(id)) map.setFilter(id, f);
  const bands = (META.summary && META.summary.bands) || {};
  const sel = BANDS.filter(b => ACTIVE.has(b))
                   .reduce((a, b) => a + ((bands[b] || {}).population || 0), 0);
  const tot = BANDS.reduce((a, b) => a + ((bands[b] || {}).population || 0), 0);
  const all = ACTIVE.size === BANDS.length;
  document.getElementById("fcount").textContent = (tot
    ? `${sel.toLocaleString()} of ${tot.toLocaleString()} people selected `
      + `(${(100 * sel / tot).toFixed(1)}%).`
    : "")
    + (all || !ACTIVE.size ? ""
       : ` Rolled up, a hexagon shows when the selected bands are the majority`
         + ` of it; past z${DETAIL_ZOOM} the filter is exact per cell.`);
}

function buildFilters() {
  const bands = (META.summary && META.summary.bands) || {};
  const box = document.getElementById("filters");
  for (const b of BANDS) {
    const info = bands[b];
    if (!info) continue;
    const el = document.createElement("label");
    el.innerHTML = `<input type="checkbox" data-band="${b}" checked> ${info.label}`
      + ` <span class="n">${Number(info.population).toLocaleString()} people</span>`;
    box.appendChild(el);
  }
  box.addEventListener("change", e => {
    const b = e.target.dataset.band;
    if (!b) return;
    e.target.checked ? ACTIVE.add(b) : ACTIVE.delete(b);
    applyFilters();
  });
  const setAll = on => {
    ACTIVE = new Set(on ? BANDS : []);
    box.querySelectorAll("input[data-band]").forEach(i => i.checked = on);
    applyFilters();
  };
  document.getElementById("fall").onclick = e => { e.preventDefault(); setAll(true); };
  document.getElementById("fnone").onclick = e => { e.preventDefault(); setAll(false); };
  applyFilters();
}

// ---- Per-transmitter propagation footprints --------------------------------
// The choropleth answers "how good is signal HERE" -- one number per cell,
// from whichever tower happens to serve it best. This answers the other half:
// "how far does THAT transmitter reach, and what stops it".
//
// web/data/footprints.bin is every transmitter's reach concatenated, sorted by
// transmitter, 12 bytes per cell. footprints.json holds the byte offset and
// count for each one, so a click fetches ONE Range slice -- a median 292 cells
// is 3.5 KB, the worst transmitter in the state is 30 KB. That is the same
// serving trick rf.pmtiles already relies on, so it needs nothing from the
// host that this page did not already need.
//
// Cell IDs travel, not geometry: h3-js rebuilds the hexagon locally. Shipping
// polygons would be ~200 bytes a cell instead of 12.
let FP = null;              // the index, once fetched
let FP_ACTIVE = null;       // which transmitter is drawn

async function loadFootprintIndex() {
  try {
    const r = await fetch("data/footprints.json", FRESH);
    if (r.ok) FP = await r.json();
  } catch { /* clicking a tower then just does nothing extra */ }
}

// Deliberately NOT a single big fetch of the blob: 14.6 MB on page load to
// serve a click that may never come is the whole reason the index exists.
async function fetchSlice(off, n) {
  const bytes = n * FP.record_bytes;
  const r = await fetch("data/footprints.bin", {
    headers: { Range: `bytes=${off}-${off + bytes - 1}` },
  });
  if (!r.ok) throw new Error(`footprint fetch ${r.status}`);
  const buf = await r.arrayBuffer();
  // A host that ignores Range answers 200 with the WHOLE file, and slicing
  // from 0 would then draw the alphabetically-first transmitter's coverage
  // under this one's name -- a wrong map that looks entirely plausible.
  const base = r.status === 206 ? 0 : off;
  if (buf.byteLength < base + bytes) throw new Error("short footprint read");
  return new DataView(buf, base, bytes);
}

function decodeFootprint(view, n) {
  const feats = [], served = [];
  const threshold = FP.threshold_dbm;
  for (let i = 0; i < n; i++) {
    const o = i * FP.record_bytes;
    const cell = view.getBigUint64(o, true).toString(16);
    const rsrp = view.getInt8(o + 8);
    if (rsrp >= threshold) served.push(cell);
    feats.push({
      type: "Feature",
      geometry: { type: "Polygon",
                  coordinates: [h3.cellToBoundary(cell, true)] },
      properties: { rsrp, diff: view.getUint8(o + 9),
                    clut: view.getUint8(o + 10), los: view.getUint8(o + 11) },
    });
  }
  // The dissolved coverage contour. cellsToMultiPolygon walks the cell set's
  // shared edges, so islands come back as separate rings and terrain shadows
  // inside the footprint come back as holes -- both of which are the point.
  const edge = { type: "Feature", properties: {},
                 geometry: { type: "MultiPolygon",
                             coordinates: h3.cellsToMultiPolygon(served, true) } };
  return [{ type: "FeatureCollection", features: feats }, edge];
}

async function showFootprint(txId, title, subtitle) {
  const el = document.getElementById("info");
  if (!FP || !FP.tx[txId]) {
    el.innerHTML = `<h2>${title}</h2><div class="why">${subtitle}.<br>
      No footprint shipped for this structure: it reaches no modelled cell
      above ${FP ? FP.floor_dbm : -115} dBm.</div>`;
    el.style.display = "block";
    return;
  }
  const [off, n, served, pop] = FP.tx[txId];
  el.innerHTML = `<h2>${title}</h2><div class="why">Loading footprint...</div>`;
  el.style.display = "block";

  let fc, edge;
  try {
    [fc, edge] = decodeFootprint(await fetchSlice(off, n), n);
  } catch (err) {
    el.innerHTML = `<h2>${title}</h2><div class="why">${err.message}</div>`;
    return;
  }
  FP_ACTIVE = txId;
  map.getSource("fp").setData(fc);
  map.getSource("fp-edge").setData(edge);
  hexOpacity();
  // Frame it. A 40 km footprint clicked from z13 is otherwise three hexagons
  // filling the screen with no way to tell anything happened, and clicked
  // from z9 it runs off two edges. The map moving is the answer to the
  // question that was just asked.
  const b = new maplibregl.LngLatBounds();
  for (const f of fc.features)
    for (const c of f.geometry.coordinates[0]) b.extend(c);
  map.fitBounds(b, { padding: 60, maxZoom: 11, duration: 500 });

  const p = fc.features.map(f => f.properties);
  const los = p.filter(f => f.los).length;
  const diff = p.map(f => f.diff).sort((a, b) => a - b);
  const rows = [
    ["Cells reached", `${n.toLocaleString()} (to ${FP.floor_dbm} dBm)`],
    ["Above threshold", `${served.toLocaleString()} cells `
       + `(${(100 * served / n).toFixed(0)}%)`],
    ["People served", pop.toLocaleString()],
    ["Strongest cell", `${Math.max(...p.map(f => f.rsrp))} dBm`],
    ["Line of sight", `${(100 * los / n).toFixed(0)}% of reached cells`],
    ["Median diffraction", `${diff[diff.length >> 1]} dB`],
  ];
  el.innerHTML = `<h2>${title}</h2>
    <div class="sub">${subtitle}</div>
    <table>${rows.map(([k, v]) =>
      `<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join("")}</table>
    <details><summary>How this is computed</summary><p>${budgetText()}
      <a href="https://github.com/owensross27/sedona-rf-coverage/blob/main/docs/link-budget.md"
         target="_blank" rel="noopener">Full link budget</a>.</p></details>
    <div class="why"><a href="#" id="fpclear">clear footprint</a></div>`;
  document.getElementById("fpclear").onclick = e => {
    e.preventDefault();
    clearFootprint();
    el.style.display = "none";
  };
}

// The "how was this computed" text, built from meta.json rather than typed
// here, so it cannot describe a different model from the one that drew the
// map. Every term below is a term the kernel actually subtracts.
function budgetText() {
  const rf = META.rf || {};
  return `${rf.eirp_dbm} dBm EIRP spread over `
    + `${rf.subcarriers} subcarriers, minus free-space loss at `
    + `${META.frequency_mhz} MHz, minus terrain diffraction (Deygout, up to `
    + `three knife edges over a ${rf.profile_samples}-sample elevation profile `
    + `from a 30 m DEM, k=${rf.k_factor} earth), minus clutter at the receiver `
    + `(land-cover class, or a knife edge over the mapped building height, `
    + `whichever is larger), minus a ${rf.shadow_margin_db} dB shadow-fading `
    + `margin, to a ${rf.rx_height_m} m receiver. Cut off at `
    + `${rf.max_link_km} km. `;
}

function clearFootprint() {
  FP_ACTIVE = null;
  const empty = { type: "FeatureCollection", features: [] };
  map.getSource("fp").setData(empty);
  map.getSource("fp-edge").setData(empty);
  hexOpacity();
}

// One place decides how solid the choropleth is, because three things now
// want it out of the way: a raster surface under it, a footprint over it, and
// neither. Two of those used to be set independently and the second one to
// run won.
function hexOpacity() {
  const o = MODES[CURRENT_MODE].raster ? 0.04 : FP_ACTIVE ? 0.10 : 0.62;
  for (const id of HEX_LAYERS)
    if (map.getLayer(id)) map.setPaintProperty(id, "fill-opacity", o);
}

// ---- Place search ----------------------------------------------------------
// A local gazetteer, not a geocoder. web/data/places.json is 439 TIGER places
// in 13 KB, written by make_web_data.py from the same run that wrote the
// tiles, so the box can only offer somewhere the map actually has data for.
// Filtering 439 strings on every keystroke is microseconds; a search index
// here would be more code than the data.
//
// The box stays HIDDEN until the fetch lands. A search input that silently
// matches nothing because its data 404'd is worse than no search input, and
// this file is deliberately deployable without the pipeline having run.
let PLACES = [];
async function loadPlaces() {
  try {
    const r = await fetch("data/places.json", FRESH);
    if (!r.ok) return;
    PLACES = await r.json();
  } catch { return; }
  if (!PLACES.length) return;

  const q = document.getElementById("q");
  const hits = document.getElementById("hits");
  q.hidden = false;
  let sel = -1;

  const render = () => {
    const s = q.value.trim().toLowerCase();
    // Prefix matches first, then the SHORTEST name. A plain substring filter
    // in TIGER's alphabetical order answers "char" with Charlton Heights and
    // buries Charleston under it. Length is a stand-in for prominence --
    // TIGER PLACE carries no population field, and the less-qualified name is
    // the one a short query usually means.
    const rank = p => p[0].toLowerCase().startsWith(s) ? 0 : 1;
    const m = s ? PLACES.filter(p => p[0].toLowerCase().includes(s))
                        .sort((a, b) => rank(a) - rank(b)
                                        || a[0].length - b[0].length)
                        .slice(0, 8)
                : [];
    sel = -1;
    hits.innerHTML = m.map((p, i) =>
      `<li role="option" data-i="${i}">${p[0]}</li>`).join("");
    hits._m = m;
  };
  const go = i => {
    const p = (hits._m || [])[i];
    if (!p) return;
    // Past DETAIL_ZOOM on purpose: someone searching a town wants the r8
    // cells and the click panel, not the rolled-up hexagon it sits in.
    map.flyTo({ center: [p[2], p[1]], zoom: DETAIL_ZOOM + 1 });
    q.value = p[0];
    hits.innerHTML = "";
  };

  q.addEventListener("input", render);
  hits.addEventListener("click", e => {
    if (e.target.dataset.i !== undefined) go(Number(e.target.dataset.i));
  });
  q.addEventListener("keydown", e => {
    const n = hits.children.length;
    if (e.key === "Enter") { go(sel < 0 ? 0 : sel); e.preventDefault(); return; }
    if (e.key === "Escape") { hits.innerHTML = ""; return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    if (!n) return;
    // From nothing selected, Down picks the first and Up picks the last.
    sel = e.key === "ArrowDown" ? (sel + 1) % n : (sel <= 0 ? n : sel) - 1;
    [...hits.children].forEach((li, i) =>
      li.setAttribute("aria-selected", i === sel));
  });
}

// ---- Ask panel -------------------------------------------------------------
// Bring-your-own-key, called straight from the browser. There is deliberately
// no proxy: this page is a static file on GitHub Pages, and standing up a
// server to relay the request would mean either holding somebody's key or
// paying for everyone's questions. The cost of that choice is that the key
// lives in localStorage, so it is stated plainly next to the input rather than
// buried -- and it is the user's own key, going to the vendor's own endpoint.
//
// anthropic-dangerous-direct-browser-access is the documented opt-in for
// exactly this: without it the API refuses browser origins outright.
const ASK = { model: "claude-sonnet-5", turns: [] };
let LAST_CELL = null;

function askContext() {
  const lvl = activeLevel();
  return {
    what_this_map_is:
      "Modelled LTE coverage for West Virginia. Predicted RSRP per H3 cell "
      + "from FCC ASR tower locations over a Copernicus 30 m DEM, with "
      + "diffraction over terrain and clutter loss from ESA WorldCover. "
      + "It is a MODEL, not a measurement, and it is technology-blind: the ASR "
      + "registry records structures, not which carrier or band is on them.",
    threshold_dbm: META.threshold_dbm,
    frequency_mhz: META.frequency_mhz,
    scope: META.scope_desc,
    statewide_summary: META.summary,
    current_view: {
      colouring_by: MODES[CURRENT_MODE].label,
      showing: lvl.detail
        ? "full detail, one hexagon = one H3 r8 cell of 0.74 km2"
        : `rolled up to H3 ${lvl.res}, one hexagon = ${lvl.km2} km2 `
          + `merging ${lvl.n} r8 cells`,
      rollup_rules: lvl.detail ? null
        : "counts are sums, ground properties are area means, RSRP is a MEDIAN",
    },
    selected_cell: LAST_CELL,
    service_bands_visible: BANDS.filter(b => ACTIVE.has(b)),
  };
}

async function ask() {
  const out = document.getElementById("answer");
  const key = document.getElementById("apikey").value.trim();
  const q = document.getElementById("question").value.trim();
  if (!key) { out.textContent = "Paste an API key first."; return; }
  if (!q) return;
  localStorage.setItem("rfc_api_key", key);
  out.textContent = "Thinking...";
  ASK.turns.push({ role: "user", content:
    `Context (JSON):\n${JSON.stringify(askContext(), null, 1)}\n\nQuestion: ${q}` });
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: ASK.model,
        max_tokens: 900,
        system:
          "You answer questions about a modelled RF coverage map of West "
          + "Virginia. Use only the JSON context provided; if it does not "
          + "contain the answer, say so rather than guessing. Never present a "
          + "modelled number as a measurement. Be concise and concrete: cite "
          + "the actual figures from the context. Two or three short "
          + "paragraphs at most.",
        // Only the last few turns: the context block is re-sent every time
        // and is the bulk of the tokens, so a long history costs a lot and
        // adds little.
        messages: ASK.turns.slice(-6),
      }),
    });
    if (!r.ok) {
      const body = await r.text();
      out.textContent = `API returned ${r.status}. ${body.slice(0, 300)}`;
      ASK.turns.pop();
      return;
    }
    const j = await r.json();
    const text = (j.content || []).filter(c => c.type === "text")
                                  .map(c => c.text).join("\n");
    ASK.turns.push({ role: "assistant", content: text });
    out.textContent = text;
  } catch (e) {
    // A failed fetch here is almost always CORS or an offline browser, and
    // the console message is more useful than the exception's own text.
    out.textContent = "Request failed: " + e.message
      + " (check the key, and that the browser can reach api.anthropic.com)";
    ASK.turns.pop();
  }
}

function showRollup(p, res) {
  LAST_CELL = { level: res, ...p };
  const el = document.getElementById("info");
  const pop = Number(p.pop), gap = Number(p.gap_pop);
  const rows = [
    ["People here", `${pop.toLocaleString()} (${p.pop_km2}/km²)`],
    ["In gap cells", `${gap.toLocaleString()} (${pop > 0
        ? (100 * gap / pop).toFixed(1) : "0.0"}%)`],
    ["Ground served", `${p.cell_pct}% of ${Number(p.cells).toLocaleString()} cells`],
    ["Median signal", p.rsrp !== undefined
        ? `${p.rsrp} dBm (cells with a link)` : "no link anywhere here"],
    ["Towers in range", `${p.n_srv} per cell on average`],
    ["Tree cover", `${p.tree}%`],
    ["Terrain relief", `${p.relief} m per cell`],
    ["Mean elevation", `${p.elev} m`],
    ["Demand", Number(p.demand).toLocaleString()],
  ];
  el.innerHTML = `<h2>H3 ${res} cell</h2>
    <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join("")}</table>
    <div class="why">Aggregated from ${Number(p.cells).toLocaleString()} r8 cells.
    Counts are sums, ground properties are area means, and signal is a
    <b>median</b> -- never a mean, which would average a strong cell against a
    dead one and invent a comfortable middle.
    Zoom past ${DETAIL_ZOOM} for per-cell detail.</div>`;
  el.style.display = "block";
}

function showHex(p) {
  LAST_CELL = { level: "r8", ...p };
  const el = document.getElementById("info");
  const covered = p.covered === true || p.covered === "true";
  const rows = [
    ["Signal", p.rsrp !== undefined ? `${p.rsrp} dBm ${covered ? "(covered)" : "(gap)"}`
                                    : "no plausible link at all"],
    ["People here", Number(p.pop).toLocaleString()],
    ["Serving tower", p.srv_asr
       ? `ASR ${p.srv_asr} &middot; ${p.srv_h ?? "?"} m mast &middot; ` +
         `${p.srv_km} km &middot; ${p.srv_los === true || p.srv_los === "true"
            ? "line of sight" : "terrain-obstructed"}`
       : "none in range"],
    ["Towers above threshold", p.n_srv],
    ["Tree cover", `${p.tree}%`],
    ["Terrain relief", `${p.relief} m in this cell`],
    ["Buildings", p.bldg_max > 0
       ? `mean ${p.bldg_mean} m, tallest ${p.bldg_max} m` : "none mapped"],
  ];

  // The sentence the map exists for: which term is costing this cell.
  const why = [];
  if (p.srv_los === false || p.srv_los === "false")
    why.push("the path to its serving tower is blocked by terrain");
  if (p.tree >= 80) why.push(`heavy tree cover (${p.tree}%) adds clutter loss`);
  if (p.relief >= 150) why.push(`rugged terrain (${p.relief} m of relief) drives diffraction`);
  if (p.srv_km >= 15) why.push(`the nearest server is far away (${p.srv_km} km)`);
  if (p.bldg_max >= 15) why.push(`tall buildings (${p.bldg_max} m) shadow street level`);
  if (p.srv_asr === undefined) why.push("no registered structure is in range at all");

  el.innerHTML = `<h2>Cell ${p.h3}</h2>
    <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join("")}</table>
    ${why.length ? `<div class="why">Why signal is limited here: ${why.join("; ")}.</div>`
                 : covered ? `<div class="why">Well served.</div>` : ""}`;
  el.style.display = "block";
}
</script>
</body>
</html>
