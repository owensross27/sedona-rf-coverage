<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WV RF coverage</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 2; background: rgba(255,255,255,.95);
    border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 13px;
  }
  #controls { top: 10px; left: 10px; padding: 10px 12px; max-width: 240px; }
  #controls h1 { font-size: 14px; margin: 0 0 6px; }
  #controls label { display: block; margin: 2px 0; cursor: pointer; }
  #controls .note { color: #666; font-size: 11px; margin-top: 6px; }
  #info { bottom: 24px; left: 10px; padding: 10px 12px; max-width: 300px; display: none; }
  #info h2 { font-size: 13px; margin: 0 0 4px; }
  #info td { padding: 1px 6px 1px 0; vertical-align: top; }
  #info .why { margin-top: 6px; padding-top: 6px; border-top: 1px solid #ddd; color: #444; }
  #legend { bottom: 24px; right: 10px; padding: 8px 12px; font-size: 11px; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 2px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" class="panel">
  <h1>West Virginia RF coverage</h1>
  <div id="modes"></div>
  <label><input type="checkbox" id="towers-toggle" checked> ASR structures</label>
  <label><input type="checkbox" id="sites-toggle" checked> Recommended sites</label>
  <div class="note" id="note">Modelled 700&nbsp;MHz LTE, -105&nbsp;dBm threshold.</div>
  <div class="note" id="zoomhint"></div>
</div>

<div id="info" class="panel"></div>
<div id="legend" class="panel"></div>

<script>
const RSRP_LEGEND = [["#2c105c","-125 dBm"],["#b63679","-105 (threshold)"],
                     ["#fdae78","-85"],["#fcfdbf","-70"]];
const MODES = {
  rsrp: {
    label: "Signal (best-server RSRP)",
    paint: ["interpolate", ["linear"], ["coalesce", ["get", "rsrp"], -125],
            -125, "#2c105c", -115, "#711f81", -105, "#b63679",
            -95, "#ee605e", -85, "#fdae78", -70, "#fcfdbf"],
    legend: RSRP_LEGEND,
  },
  // The two raster entries are appended at runtime by loadSurfaces() -- they
  // exist only when the per-pixel surfaces have been built (make surface).
  covered: {
    label: "Coverage vs gap",
    paint: ["case", ["get", "covered"], "#7cbf8c", "#d1495b"],
    legend: [["#7cbf8c","covered"],["#d1495b","gap"]],
  },
  pop: {
    label: "Population",
    paint: ["interpolate", ["linear"], ["sqrt", ["get", "pop"]],
            0, "#f7fbff", 5, "#c6dbef", 15, "#6baed6", 40, "#2171b5", 80, "#08306b"],
    legend: [["#f7fbff","0"],["#6baed6","~200"],["#08306b","6000+"]],
  },
  tree: {
    label: "Tree cover",
    paint: ["interpolate", ["linear"], ["get", "tree"],
            0, "#f7fcf5", 50, "#a1d99b", 80, "#41ab5d", 100, "#00441b"],
    legend: [["#f7fcf5","0%"],["#41ab5d","80%"],["#00441b","100%"]],
  },
  relief: {
    label: "Terrain relief",
    paint: ["interpolate", ["linear"], ["get", "relief"],
            0, "#ffffe5", 100, "#fe9929", 200, "#cc4c02", 300, "#662506"],
    legend: [["#ffffe5","0 m"],["#fe9929","100 m"],["#662506","300 m"]],
  },
};

// LEVEL OF DETAIL. Four H3 resolutions on DISJOINT zoom bands, so exactly one
// hex layer is ever drawn and the feature count in view stays roughly constant
// while panning. Statewide that is ~320 / ~1,950 / ~12,900 / 88,281 cells --
// without this, z6 would try to draw all 88,281 at once.
//
// maxzoom is EXCLUSIVE in MapLibre (a layer is hidden at and above it), so the
// bands butt up against each other with no overlap and no gap. These must stay
// in step with the -Z/-z pairs in scripts/make_tiles.sh: a layer whose band
// falls outside the zoom range its tiles were built for renders nothing at
// all, silently.
const LOD = [
  { id: "hex5", min: 0,  max: 9,  res: "r5" },
  { id: "hex6", min: 9,  max: 11, res: "r6" },
  { id: "hex7", min: 11, max: 13, res: "r7" },
];
const DETAIL_ZOOM = 13;   // r8 and the full click panel from here up

// The roll-up layers show PERCENT OF POPULATION COVERED, not a rolled-up
// signal level -- see scripts/make_web_data.py on why an averaged RSRP would
// be a lie. pop_pct is absent where nobody lives (0/0 is not 0% coverage), so
// it falls back to the share of CELLS covered rather than painting empty
// ridgelines as the worst places in the state.
const LOD_PAINT = ["interpolate", ["linear"],
  ["coalesce", ["get", "pop_pct"], ["get", "cell_pct"], 0],
  0, "#d1495b", 50, "#edae49", 85, "#c3d17a", 100, "#7cbf8c"];
const LOD_LEGEND = [["#d1495b", "0% of people covered"], ["#edae49", "50%"],
                    ["#c3d17a", "85%"], ["#7cbf8c", "100%"]];

protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/positron",
  center: [-81.55, 38.32],
  zoom: 9,
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }),
               "bottom-left");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "imperial" }),
               "bottom-left");

function buildOverlay() {
  // Absolute URL from the page's own origin: a RELATIVE pmtiles:// URL also
  // fails silently. Origin-relative keeps the file deployable to any host.
  map.addSource("rf", {
    type: "vector",
    url: "pmtiles://" + new URL("data/rf.pmtiles", location.href).href,
  });

  // Coarse first so the r8 layer sits on top; they never coexist at a given
  // zoom anyway, but draw order decides which one owns the cursor if a band
  // boundary is ever made to overlap.
  for (const l of LOD) {
    map.addLayer({
      id: l.id, type: "fill", source: "rf", "source-layer": l.id,
      minzoom: l.min, maxzoom: l.max,
      paint: { "fill-color": LOD_PAINT, "fill-opacity": 0.62,
               "fill-outline-color": "rgba(0,0,0,0.12)" },
    });
  }

  map.addLayer({
    id: "hexes", type: "fill", source: "rf", "source-layer": "hexes",
    minzoom: DETAIL_ZOOM,
    paint: { "fill-color": MODES.rsrp.paint, "fill-opacity": 0.62,
             "fill-outline-color": "rgba(0,0,0,0.12)" },
  });
  map.addLayer({
    id: "hex-hover", type: "line", source: "rf", "source-layer": "hexes",
    minzoom: DETAIL_ZOOM,
    paint: { "line-color": "#000", "line-width": 2 },
    filter: ["==", ["get", "h3"], ""],
  });
  map.addLayer({
    id: "towers", type: "circle", source: "rf", "source-layer": "towers",
    // Statewide there are 6,696 registered structures. Drawn at z4 they are a
    // solid mat of white circles that completely hides the coverage
    // choropleth underneath -- the map stops showing the thing it is for.
    // They only mean anything once you are looking at a region, which is the
    // same zoom the r6 roll-up takes over at.
    minzoom: 9,
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["coalesce", ["get","h"], 45],
                        20, 2.5, 100, 5, 300, 9],
      "circle-color": "#ffffff", "circle-stroke-color": "#333",
      "circle-stroke-width": 1,
    },
  });
  map.addLayer({
    id: "sites", type: "circle", source: "rf", "source-layer": "sites",
    paint: { "circle-radius": 7, "circle-color": "#ffd166",
             "circle-stroke-color": "#000", "circle-stroke-width": 1.5 },
  });
  map.addLayer({
    id: "site-rank", type: "symbol", source: "rf", "source-layer": "sites",
    // text-font MUST name a font the basemap's glyph server actually has
    // (OpenFreeMap serves Noto). Omitting it falls back to "Open Sans
    // Regular", the glyph request 404s, and the unresolved dependency wedges
    // EVERY tile of this source -- all five layers blank, fills included, no
    // error surfaced. This one missing line was the whole "map renders
    // nothing" failure.
    layout: { "text-field": ["to-string", ["get", "rank"]],
              "text-font": ["Noto Sans Regular"],
              "text-size": 10, "text-offset": [0, -1.3] },
    paint: { "text-halo-color": "#fff", "text-halo-width": 1.5 },
  });

  const mode = document.querySelector('input[name="mode"]:checked');
  setMode(mode ? mode.value : "rsrp");
}

// Per-pixel propagation surfaces (90 m, terrain shadows visible) as image
// overlays under the hex layer. Optional on purpose: a clone that has not run
// `make surface` still gets a fully working map, so absence must degrade to
// "two fewer radio buttons", never a broken page.
async function loadSurfaces() {
  let meta;
  try {
    const r = await fetch("data/surface_meta.json");
    if (!r.ok) return;
    meta = await r.json();
  } catch { return; }
  const surfaces = {
    surf_cur: { key: "rsrp_surface_current",
                label: "Signal surface (per-pixel, current towers)" },
    surf_new: { key: "rsrp_surface_upgraded",
                label: "Signal surface (per-pixel, +20 sites)" },
  };
  for (const [mode, s] of Object.entries(surfaces)) {
    if (!meta[s.key]) continue;
    map.addSource(mode, { type: "image", url: `data/${s.key}.png`,
                          coordinates: meta[s.key] });
    // Below the hexes so hover/click outlines stay visible; the hex fill is
    // dropped to near-zero opacity in surface modes rather than hidden, so
    // the click-a-hex panel keeps working on top of the raster.
    map.addLayer({ id: mode, type: "raster", source: mode,
                   paint: { "raster-opacity": 1.0 },
                   layout: { visibility: "none" } }, "hexes");
    MODES[mode] = { raster: true, label: s.label, legend: RSRP_LEGEND };
    const label = document.createElement("label");
    label.innerHTML = `<input type="radio" name="mode" value="${mode}"> ${s.label}`;
    document.getElementById("modes").appendChild(label);
  }
}

// The caption used to hardcode "Demo scope: Kanawha County", which quietly
// became false the moment a statewide tileset was built. meta.json is written
// by the same script that writes the tiles, so it cannot disagree with them.
async function loadMeta() {
  try {
    const m = await (await fetch("data/meta.json")).json();
    if (!m.scope_desc) return;
    document.getElementById("note").innerHTML +=
      `<br>${m.scope_desc}, ${Number(m.n_hexes).toLocaleString()} cells.`;
    if (m.bounds) map.fitBounds(m.bounds, { padding: 24, duration: 0 });
  } catch { /* a map with no caption still works */ }
}

// "style.load", NOT "load". `load` waits for the first visually complete
// render, which includes the third-party basemap's tiles -- so if
// tiles.openfreemap.org is slow, down, or blocked by a corporate proxy, the
// event never fires and NONE of this runs: no source, no layers, no controls,
// no error in the console. The RF data is the product here and the basemap is
// decoration, so the overlay must not be hostage to it. Measured: in a sandbox
// that blocks the tile host, `load` never fires and the page renders black
// while every asset it actually needs sits loaded and idle.
map.on("style.load", () => {
  buildOverlay();
  loadSurfaces();
  loadMeta();

  const modes = document.getElementById("modes");
  Object.entries(MODES).forEach(([key, m], i) => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="radio" name="mode" value="${key}"
                       ${i === 0 ? "checked" : ""}> ${m.label}`;
    modes.appendChild(label);
  });
  modes.addEventListener("change", e => setMode(e.target.value));

  document.getElementById("towers-toggle").addEventListener("change", e =>
    map.setLayoutProperty("towers", "visibility", e.target.checked ? "visible" : "none"));
  document.getElementById("sites-toggle").addEventListener("change", e => {
    for (const id of ["sites", "site-rank"])
      map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
  });

  for (const l of LOD) {
    map.on("click", l.id, e => showRollup(e.features[0].properties, l.res));
    map.on("mouseenter", l.id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", l.id, () => map.getCanvas().style.cursor = "");
  }
  map.on("zoom", updateZoomUI);
  updateZoomUI();

  map.on("click", "hexes", e => showHex(e.features[0].properties));
  map.on("mousemove", "hexes", e => {
    map.getCanvas().style.cursor = "pointer";
    map.setFilter("hex-hover", ["==", ["get", "h3"], e.features[0].properties.h3]);
  });
  map.on("mouseleave", "hexes", () => {
    map.getCanvas().style.cursor = "";
    map.setFilter("hex-hover", ["==", ["get", "h3"], ""]);
  });
  map.on("click", "towers", e => {
    const p = e.features[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`<b>ASR ${p.asr}</b><br>${p.h ?? "?"} m ${p.type ?? "structure"}`)
      .addTo(map);
  });
  map.on("click", "sites", e => {
    const p = e.features[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`<b>Recommended site #${p.rank}</b><br>${p.kind}, ${p.h} m mast` +
               `<br>+${Number(p.gain).toLocaleString()} demand newly covered`)
      .addTo(map);
  });
});

function setMode(key) {
  const m = MODES[key];
  CURRENT_MODE = key;
  // The roll-up layers carry none of the r8 attributes (no rsrp, no tree, no
  // relief), so they keep LOD_PAINT under every mode. Only opacity follows,
  // so the raster surfaces stay visible underneath.
  for (const l of LOD)
    if (map.getLayer(l.id))
      map.setPaintProperty(l.id, "fill-opacity", m.raster ? 0.04 : 0.62);
  for (const id of ["surf_cur", "surf_new"])
    if (map.getLayer(id))
      map.setLayoutProperty(id, "visibility",
                            m.raster && id === key ? "visible" : "none");
  if (map.getLayer("hexes")) {
    // Surface modes keep the hexes as a nearly invisible click target so the
    // explainability panel works on top of the raster.
    map.setPaintProperty("hexes", "fill-opacity", m.raster ? 0.04 : 0.62);
    if (!m.raster)
      map.setPaintProperty("hexes", "fill-color", m.paint);
  }
  updateZoomUI();
}

// The legend has to follow the zoom, not just the mode: below DETAIL_ZOOM the
// map is drawing a population-weighted roll-up, and showing the RSRP ramp
// there would label a coverage choropleth as a signal-strength one.
let CURRENT_MODE = "rsrp";
function updateZoomUI() {
  const detail = map.getZoom() >= DETAIL_ZOOM;
  const legend = detail ? MODES[CURRENT_MODE].legend : LOD_LEGEND;
  document.getElementById("legend").innerHTML =
    (detail ? "" : "<div style='margin-bottom:4px;color:#666'>Rolled up</div>") +
    legend.map(([c, t]) =>
      `<div><span class="swatch" style="background:${c}"></span>${t}</div>`).join("");
  document.getElementById("zoomhint").textContent = detail
    ? "Full detail: every H3 r8 cell. Click one for the full breakdown."
    : "Zoomed out: cells rolled up, coloured by share of population covered. "
      + "Zoom in for per-cell signal.";
}

function showRollup(p, res) {
  const el = document.getElementById("info");
  const pop = Number(p.pop), gap = Number(p.gap_pop);
  const rows = [
    ["People here", pop.toLocaleString()],
    ["In gap cells", `${gap.toLocaleString()} (${pop > 0
        ? (100 * gap / pop).toFixed(1) : "0.0"}%)`],
    ["Cells covered", `${p.cell_pct}% of ${Number(p.cells).toLocaleString()}`],
    ["Demand", Number(p.demand).toLocaleString()],
  ];
  el.innerHTML = `<h2>H3 ${res} cell</h2>
    <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join("")}</table>
    <div class="why">Aggregated from ${Number(p.cells).toLocaleString()} r8 cells.
    Signal level is not rolled up: averaging it would hide the gaps.
    Zoom past ${DETAIL_ZOOM} for per-cell detail.</div>`;
  el.style.display = "block";
}

function showHex(p) {
  const el = document.getElementById("info");
  const covered = p.covered === true || p.covered === "true";
  const rows = [
    ["Signal", p.rsrp !== undefined ? `${p.rsrp} dBm ${covered ? "(covered)" : "(gap)"}`
                                    : "no plausible link at all"],
    ["People here", Number(p.pop).toLocaleString()],
    ["Serving tower", p.srv_asr
       ? `ASR ${p.srv_asr} &middot; ${p.srv_h ?? "?"} m mast &middot; ` +
         `${p.srv_km} km &middot; ${p.srv_los === true || p.srv_los === "true"
            ? "line of sight" : "terrain-obstructed"}`
       : "none in range"],
    ["Towers above threshold", p.n_srv],
    ["Tree cover", `${p.tree}%`],
    ["Terrain relief", `${p.relief} m in this cell`],
    ["Buildings", p.bldg_max > 0
       ? `mean ${p.bldg_mean} m, tallest ${p.bldg_max} m` : "none mapped"],
  ];

  // The sentence the map exists for: which term is costing this cell.
  const why = [];
  if (p.srv_los === false || p.srv_los === "false")
    why.push("the path to its serving tower is blocked by terrain");
  if (p.tree >= 80) why.push(`heavy tree cover (${p.tree}%) adds clutter loss`);
  if (p.relief >= 150) why.push(`rugged terrain (${p.relief} m of relief) drives diffraction`);
  if (p.srv_km >= 15) why.push(`the nearest server is far away (${p.srv_km} km)`);
  if (p.bldg_max >= 15) why.push(`tall buildings (${p.bldg_max} m) shadow street level`);
  if (p.srv_asr === undefined) why.push("no registered structure is in range at all");

  el.innerHTML = `<h2>Cell ${p.h3}</h2>
    <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td><b>${v}</b></td></tr>`).join("")}</table>
    ${why.length ? `<div class="why">Why signal is limited here: ${why.join("; ")}.</div>`
                 : covered ? `<div class="why">Well served.</div>` : ""}`;
  el.style.display = "block";
}
</script>
</body>
</html>
