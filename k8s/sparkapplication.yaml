# kubeflow spark-operator SparkApplication. Applied by `make job STAGE=05
# SCOPE=state`, which substitutes the ${...} placeholders with envsubst -- the
# AWS account id and bucket name are never committed to this repo.
#
# CRD fields verified against the real v2.5.2 schema, not guessed:
#   curl -s https://raw.githubusercontent.com/kubeflow/spark-operator/v2.5.2/\
#     charts/spark-operator-chart/crds/sparkoperator.k8s.io_sparkapplications.yaml
# apiVersion is sparkoperator.k8s.io/v1beta2 -- the operator's "v2.5.2" is the
# release/chart version, not the CRD API version. type enum is
# ["Java","Python","Scala","R"]; mode enum is ["cluster","client"]; env uses
# corev1 EnvVar (name/value list), NOT the deprecated envVars map.
#
# serviceAccountName assumes:
#   helm install spark-operator spark-operator/spark-operator \
#     --namespace spark-operator --create-namespace --version 2.5.2
# which auto-creates a Role/RoleBinding/ServiceAccount for spark apps in every
# namespace listed in spark.jobNamespaces (default ["default"]). Release name
# "spark-operator" -> service account "spark-operator-spark".
#
# The operator CRD is the primary submission path here, inverting the choice
# made in the sibling s2-field-ndvi repo. On a single-job kind cluster the
# operator was pure overhead; across this pipeline's stages it earns its keep:
# `kubectl get sparkapplication` gives job status without parsing driver logs,
# and this file is an artifact a reviewer can read. Native
# `spark-submit --master k8s://` stays documented in docs/eks-runbook.md as
# the dev-loop fallback.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: rf-coverage-${STAGE_NAME}
  namespace: default
  labels:
    project: rf-coverage
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: ${ECR_IMAGE}
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/rfc/src/${STAGE_FILE}
  sparkVersion: "3.5.9"
  restartPolicy:
    type: Never          # surface failures rather than retry-masking them
  sparkConf:
    spark.kubernetes.namespace: default
    # Shuffle spill goes to a sized emptyDir rather than the container
    # filesystem. The sibling repo recorded a run spilling ~30 GB; the
    # container's writable layer is not the place for that.
    #
    # THE VOLUME NAME IS LOAD-BEARING. Spark treats any volume named
    # `spark-local-dir-*` as a local directory: it points SPARK_LOCAL_DIRS at
    # the mount and skips generating its own emptyDir. Name it anything else
    # and you get both -- Spark's generated mount plus this one, at the same
    # path -- and the API server rejects the driver pod outright:
    #   volumeMounts[2].mountPath: Invalid value: "/tmp/spark-local": must be unique
    # which arrives as a 422 wrapped in a fabric8 stack trace, under a
    # misleading `Please check "kubectl auth can-i create pod"` line that sends
    # you hunting an RBAC problem that does not exist.
    #
    # Setting spark.local.dir explicitly causes the same collision, so it is
    # deliberately absent: the volume name is now the single source of truth.
    spark.kubernetes.driver.volumes.emptyDir.spark-local-dir-1.mount.path: /tmp/spark-local
    spark.kubernetes.executor.volumes.emptyDir.spark-local-dir-1.mount.path: /tmp/spark-local
    spark.kubernetes.executor.volumes.emptyDir.spark-local-dir-1.options.sizeLimit: 20Gi
  driver:
    cores: 1
    # PySpark's memory overhead factor is 0.4, NOT the 0.1 that applies to
    # JVM-only jobs -- so `memory: 2g` requests roughly 2.8 GiB of pod memory.
    # Size against node ALLOCATABLE, not node RAM, or pods sit Pending with a
    # confusing message.
    memory: 2g
    serviceAccount: spark-operator-spark
    nodeSelector:
      # Driver on the on-demand group: a spot reclaim then costs executors,
      # which Spark re-requests, instead of killing the whole job.
      workload: serve
      kubernetes.io/arch: arm64
    env: &rfc_env
      - name: SCOPE
        value: "${SCOPE}"
      - name: RF_BUCKET
        value: "${RF_BUCKET}"
      - name: RFC_JARS_BAKED
        value: "1"
      # GDAL reads COGs through /vsis3/, and with no region set it talks to
      # us-east-1. A us-west-2 bucket answers that with a 301, which rasterio
      # surfaces as "not a supported file format" -- it reads as a corrupt COG,
      # not as a misrouted request. boto3 and hadoop-aws are unaffected, so the
      # failure appears only in the raster stages.
      - name: AWS_DEFAULT_REGION
        value: "${AWS_REGION}"
      # The Spark image's user has no home directory (HOME=/nonexistent), which
      # nothing notices until duckdb runs: 02_terrain reads Overture buildings
      # through it, and duckdb resolves a home for its config on startup --
      #   _duckdb.IOException: IO Error: Can't find the home directory at
      #   '/nonexistent'
      # It cannot reproduce locally, where HOME is always set. /tmp is
      # world-writable in the image and duckdb needs nowhere durable here: the
      # spatial extension is deliberately never installed (the bbox struct
      # supplies both the pruning and the coordinate), so this is config only.
      - name: HOME
        value: /tmp
      # Stage 03 alone needs this, and a keyless request does not error: the
      # Census API returns HTTP 200 with a redirect to missing_key.html. It
      # comes from a Secret created by `make cluster-up` so it stays out of a
      # public repo, and optional:true so the eight stages that do not need it
      # are not held hostage to it existing.
      - name: CENSUS_API_KEY
        valueFrom:
          secretKeyRef:
            name: rf-secrets
            key: CENSUS_API_KEY
            optional: true
  executor:
    # Configurable because the stages are not the same shape. 01/02/03 are
    # driver-heavy (HTTP fetches, raster merges) and barely touch executors --
    # holding three spot nodes through them is ~$0.36/hr for nothing. The joins
    # and the propagation fan-out (04/05/08/09) are what actually want them.
    # `make job STAGE=02 EXECUTORS=1`.
    instances: ${EXECUTORS}
    cores: 6
    # SIZED AGAINST THE SMALLEST INSTANCE THE NODEGROUP CAN PRODUCE, not the
    # one the spec was written around. cluster.yaml diversifies spot capacity
    # across four types whose memory is NOT uniform -- r7g.2xlarge and
    # m7g.4xlarge are 64 GiB, m7g.2xlarge and c7g.4xlarge are 32 GiB -- and
    # capacity-optimized allocation is free to pick any of them. It picked
    # m7g.2xlarge, the cheapest in the pool at the time ($0.1094/hr), so
    # getting the good price is what triggered this.
    #
    # An earlier 24g here assumed r7g.2xlarge: 24 x 1.4 = 33.6 GiB against a
    # measured 29.8 GiB allocatable, so every executor sat Pending forever with
    # `0/4 nodes are available: 3 Insufficient memory` while the driver ran
    # happily and the job looked alive. 20 x 1.4 = 28 GiB fits the 32 GiB
    # machines with room for the kubelet; on a 64 GiB node it simply leaves
    # headroom. Verify allocatable rather than subtracting from the spec sheet:
    #   kubectl get nodes -l workload=spark -o json | ...status.allocatable
    memory: 20g
    nodeSelector:
      workload: spark
      kubernetes.io/arch: arm64
    # Same block as the driver, by anchor rather than by copy. Executors that
    # silently disagree with the driver about SCOPE or RF_BUCKET produce a run
    # that half-succeeds against the wrong data, which is worse than a crash.
    env: *rfc_env
  # No volumes: every input and output is S3. Nothing to orphan on teardown.
